[project]
name = "airrad"
version = "0.1.0"
description = "Escenarios de exposición a radiación cósmica galáctica en rutas australes con CARI-7 (FAA)"
authors = [
    { name = "Michael Haacke", email = "haacke96@gmail.com" }
]
requires-python = ">=3.13,<3.14"
readme = "README.md"
license = "MIT"
dependencies = [
    "cartopy>=0.26.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyproj>=3.8.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
airrad = "airrad.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cari: requiere la instalación de CARI-7 y un runner disponible (lento)"]
